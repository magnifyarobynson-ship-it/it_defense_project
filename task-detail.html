<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Detail — Task Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-logo" href="index.html">✅ Task<span>Manager</span></a>
      <ul class="nav-links">
        <li><a href="index.html">🏠 Dashboard</a></li>
        <li><a href="task-list.html">📋 All Tasks</a></li>
        <li><a href="add-task.html">➕ Add Task</a></li>
        <li><a href="completed.html">✔ Completed</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="page-container">

    <!-- BACK BUTTON -->
    <a href="task-list.html" class="btn btn-secondary btn-sm" style="margin-bottom: 24px; display:inline-block;">
      ← Back to All Tasks
    </a>

    <h1 class="page-title">📄 Task Detail</h1>
    <p class="page-subtitle">View and edit the details of this task.</p>

    <!-- NOT FOUND -->
    <div id="not-found" style="display:none;">
      <div class="empty-state">
        <div class="empty-icon">❓</div>
        <h3>Task not found</h3>
        <p>This task may have been deleted.</p>
        <a href="task-list.html" class="btn btn-primary">← Go to Task List</a>
      </div>
    </div>

    <!-- VIEW MODE -->
    <div id="view-mode" style="display:none;">
      <div class="card">
        <div class="section-header">
          <h2 id="view-title" style="font-size:26px; color:#1E3A8A;"></h2>
          <div id="view-badges" style="display:flex; gap:10px;"></div>
        </div>

        <hr class="divider" style="margin-top: 10px;" />

        <div class="detail-grid">
          <div class="detail-field">
            <div class="field-label">📅 Due Date</div>
            <div class="field-value" id="view-due"></div>
          </div>
          <div class="detail-field">
            <div class="field-label">📅 Created On</div>
            <div class="field-value" id="view-created"></div>
          </div>
          <div class="detail-field">
            <div class="field-label">🔥 Priority</div>
            <div class="field-value" id="view-priority"></div>
          </div>
          <div class="detail-field">
            <div class="field-label">📌 Status</div>
            <div class="field-value" id="view-status"></div>
          </div>
        </div>

        <div class="detail-field" style="margin-top: 10px;">
          <div class="field-label">📄 Description</div>
          <div class="field-value" id="view-description" style="font-size:18px; line-height:1.6; color:#374151; white-space: pre-wrap;"></div>
        </div>

        <hr class="divider" />

        <!-- ACTION BUTTONS -->
        <div style="display: flex; gap: 14px; flex-wrap: wrap;">
          <button class="btn btn-warning" onclick="enterEditMode()">✏️ Edit Task</button>
          <button id="btn-complete" class="btn btn-success" onclick="toggleComplete()"></button>
          <button class="btn btn-danger" onclick="removeThisTask()">🗑 Delete Task</button>
        </div>
      </div>
    </div>

    <!-- EDIT MODE -->
    <div id="edit-mode" style="display:none;">
      <div class="card" style="max-width:700px;">
        <h2 style="font-size:22px; color:#1E3A8A; margin-bottom:24px;">✏️ Edit Task</h2>

        <div class="form-group">
          <label for="edit-title">📝 Task Title</label>
          <input type="text" id="edit-title" maxlength="100" />
        </div>

        <div class="form-group">
          <label for="edit-description">📄 Description</label>
          <textarea id="edit-description"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="edit-due">📅 Due Date</label>
            <input type="date" id="edit-due" />
          </div>
          <div class="form-group">
            <label for="edit-priority">🔥 Priority</label>
            <select id="edit-priority">
              <option value="Low">🟢 Low</option>
              <option value="Medium">🟡 Medium</option>
              <option value="High">🔴 High</option>
            </select>
          </div>
        </div>

        <hr class="divider" />

        <div style="display: flex; gap: 14px; flex-wrap: wrap;">
          <button class="btn btn-primary" onclick="saveEdits()" style="flex:1; min-width:140px;">💾 Save Changes</button>
          <button class="btn btn-secondary" onclick="exitEditMode()" style="flex:1; min-width:140px;">✕ Cancel</button>
        </div>
      </div>
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('id');
    let task     = null;

    async function loadTask() {
      try {
        task = await getTaskById(taskId);
        if (!task) {
          document.getElementById('not-found').style.display = 'block';
          return;
        }
        renderViewMode();
      } catch (err) {
        document.getElementById('not-found').style.display = 'block';
      }
    }

    function renderViewMode() {
      document.getElementById('not-found').style.display  = 'none';
      document.getElementById('edit-mode').style.display  = 'none';
      document.getElementById('view-mode').style.display  = 'block';

      document.getElementById('view-title').textContent       = task.title;
      document.getElementById('view-due').textContent         = formatDate(task.dueDate);
      document.getElementById('view-created').textContent     = formatDate(task.createdAt);
      document.getElementById('view-priority').innerHTML      = priorityBadge(task.priority);
      document.getElementById('view-status').innerHTML        = statusBadge(task.status);
      document.getElementById('view-description').textContent = task.description || 'No description provided.';
      document.getElementById('view-badges').innerHTML        = priorityBadge(task.priority) + ' ' + statusBadge(task.status);

      const btnComplete = document.getElementById('btn-complete');
      if (task.status === 'pending') {
        btnComplete.textContent = '✔ Mark as Completed';
        btnComplete.className   = 'btn btn-success';
      } else {
        btnComplete.textContent = '↩ Reopen Task';
        btnComplete.className   = 'btn btn-warning';
      }
    }

    function enterEditMode() {
      document.getElementById('view-mode').style.display = 'none';
      document.getElementById('edit-mode').style.display = 'block';

      document.getElementById('edit-title').value       = task.title;
      document.getElementById('edit-description').value = task.description;
      document.getElementById('edit-due').value         = task.dueDate ? task.dueDate.split('T')[0] : '';
      document.getElementById('edit-priority').value    = task.priority;
    }

    function exitEditMode() {
      document.getElementById('edit-mode').style.display = 'none';
      document.getElementById('view-mode').style.display = 'block';
    }

    async function saveEdits() {
      const title   = document.getElementById('edit-title').value.trim();
      const saveBtn = document.querySelector('#edit-mode .btn-primary');
      if (!title) { showToast('⚠ Title cannot be empty!', 'error'); return; }

      saveBtn.disabled    = true;
      saveBtn.textContent = '⏳ Saving...';

      try {
        task = await updateTask(taskId, {
          title,
          description: document.getElementById('edit-description').value.trim(),
          dueDate:     document.getElementById('edit-due').value,
          priority:    document.getElementById('edit-priority').value
        });
        showToast('💾 Task updated!', 'success');
        exitEditMode();
        renderViewMode();
      } catch (err) {
        showToast('❌ Could not save. Check server.', 'error');
      }
      saveBtn.disabled    = false;
      saveBtn.textContent = '💾 Save Changes';
    }

    async function toggleComplete() {
      try {
        if (task.status === 'pending') {
          task = await completeTask(taskId);
          showToast('✅ Task marked as completed!', 'success');
        } else {
          task = await reopenTask(taskId);
          showToast('↩ Task reopened!', 'default');
        }
        renderViewMode();
      } catch (err) {
        showToast('❌ Could not update. Check server.', 'error');
      }
    }

    async function removeThisTask() {
      if (!confirm('Are you sure you want to delete this task? This cannot be undone.')) return;
      try {
        await deleteTask(taskId);
        showToast('🗑 Task deleted.', 'error');
        setTimeout(() => { window.location.href = 'task-list.html'; }, 1000);
      } catch (err) {
        showToast('❌ Could not delete. Check server.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadTask);
  </script>

</body>
</html>
