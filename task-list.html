<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>All Tasks — Task Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-logo" href="index.html">✅ Task<span>Manager</span></a>
      <ul class="nav-links">
        <li><a href="index.html">🏠 Dashboard</a></li>
        <li><a href="task-list.html">📋 All Tasks</a></li>
        <li><a href="add-task.html">➕ Add Task</a></li>
        <li><a href="completed.html">✔ Completed</a></li>
      </ul>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="page-container">

    <div class="section-header">
      <div>
        <h1 class="page-title">📋 All Tasks</h1>
        <p class="page-subtitle">Browse, filter, and manage your tasks.</p>
      </div>
      <a href="add-task.html" class="btn btn-primary">➕ Add Task</a>
    </div>

    <!-- SEARCH -->
    <div class="search-bar">
      <input
        type="text"
        id="search-input"
        placeholder="🔍  Search tasks by title..."
      />
    </div>

    <!-- FILTER BUTTONS -->
    <div class="filter-buttons">
      <button class="filter-btn active" data-filter="all">All Tasks</button>
      <button class="filter-btn" data-filter="pending">⏳ Pending</button>
      <button class="filter-btn" data-filter="high">🔴 High Priority</button>
      <button class="filter-btn" data-filter="medium">🟡 Medium Priority</button>
      <button class="filter-btn" data-filter="low">🟢 Low Priority</button>
    </div>

    <!-- TASK COUNT -->
    <p style="color:#6B7280; font-size:16px; margin-bottom:16px;">
      Showing <strong id="task-count">0</strong> task(s)
    </p>

    <!-- TASK LIST -->
    <div id="task-list">
      <!-- Populated by JS -->
    </div>

  </div>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
  <script>
    let currentFilter = 'all';
    let searchTerm    = '';

    async function renderTasks() {
      const container = document.getElementById('task-list');
      container.innerHTML = '<p style="color:#6B7280; padding:20px;">Loading tasks...</p>';

      try {
        // Fetch only pending tasks (all filters below are client-side on pending tasks)
        let tasks = await getAllTasks();

        // Filter by status/priority
        if (currentFilter === 'pending') {
          tasks = tasks.filter(t => t.status === 'pending');
        } else if (currentFilter === 'high') {
          tasks = tasks.filter(t => t.priority === 'High' && t.status === 'pending');
        } else if (currentFilter === 'medium') {
          tasks = tasks.filter(t => t.priority === 'Medium' && t.status === 'pending');
        } else if (currentFilter === 'low') {
          tasks = tasks.filter(t => t.priority === 'Low' && t.status === 'pending');
        } else {
          // 'all' shows only pending tasks in the main list
          tasks = tasks.filter(t => t.status === 'pending');
        }

        // Apply search
        if (searchTerm) {
          tasks = tasks.filter(t =>
            t.title.toLowerCase().includes(searchTerm.toLowerCase())
          );
        }

        document.getElementById('task-count').textContent = tasks.length;

        if (tasks.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">🔍</div>
              <h3>No tasks found</h3>
              <p>Try a different filter or add a new task.</p>
              <a href="add-task.html" class="btn btn-primary">➕ Add Task</a>
            </div>`;
          return;
        }

        container.innerHTML = tasks.map(task => {
          const overdue = isOverdue(task.dueDate);
          return `
            <div class="task-card priority-${task.priority.toLowerCase()}" id="card-${task._id}">
              <div class="task-card-info">
                <div class="task-card-title">${task.title}</div>
                <div class="task-card-meta">
                  ${priorityBadge(task.priority)}
                  <span>📅 ${formatDate(task.dueDate)}</span>
                  ${overdue ? '<span style="color:#EF4444; font-weight:700;">⚠ Overdue!</span>' : ''}
                  ${task.description ? `<span>📄 ${task.description.substring(0,40)}${task.description.length > 40 ? '…' : ''}</span>` : ''}
                </div>
              </div>
              <div class="task-card-actions">
                <a href="task-detail.html?id=${task._id}" class="btn btn-outline btn-sm">👁 View</a>
                <button class="btn btn-success btn-sm" onclick="markDone('${task._id}', this)">✔ Done</button>
                <button class="btn btn-danger btn-sm"  onclick="removeTask('${task._id}')">🗑 Delete</button>
              </div>
            </div>`;
        }).join('');

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <h3>Cannot connect to server</h3>
            <p>Make sure the backend is running: <strong>npm run dev</strong></p>
          </div>`;
      }
    }

    async function markDone(id, btn) {
      btn.disabled    = true;
      btn.textContent = '⏳';
      await completeTask(id);
      showToast('✅ Task marked as completed!', 'success');
      renderTasks();
    }

    async function removeTask(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      await deleteTask(id);
      showToast('🗑 Task deleted.', 'error');
      renderTasks();
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    // Search
    document.getElementById('search-input').addEventListener('input', e => {
      searchTerm = e.target.value;
      renderTasks();
    });

    document.addEventListener('DOMContentLoaded', renderTasks);
  </script>

</body>
</html>
